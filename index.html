<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Rescue Track SLK</title>
    <meta name="description" content="Tactical coordination and live tracking system for missing person searches with rescue dog teams" />
    <meta property="og:title" content="Rescue Track SLK" />
    <meta property="og:description" content="Tactical coordination and live tracking system for missing person searches with rescue dog teams" />
    
    <script>
      // Global error listener to prevent blank screen and show diagnostics
      window.addEventListener('error', function(e) {
        console.error('[BOOT-ERROR]', e);
      });
      window.logToScreen = function(msg) { console.log('[BOOT] ' + msg); };
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <style>
      html, body {
        background-color: #0F172A;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #0F172A;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #3b82f6;
        transition: opacity 0.4s ease-out;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #1e293b;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
