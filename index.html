    <script>
      (function() {
        if (typeof window === 'undefined') return;

        // 1. WebSocket Shim for Vite HMR in proxy/sandboxed environments
        try {
          const NativeWebSocket = window.WebSocket;
          if (NativeWebSocket) {
            window.WebSocket = function(url, protocols) {
              const urlStr = String(url || '');
              const isViteHmr =
                protocols === 'vite-hmr' ||
                (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                urlStr.includes('token=') ||
                urlStr.includes('/@vite');

              if (isViteHmr) {
                const target = new EventTarget();
                const fakeWs = {
                  CONNECTING: 0,
                  OPEN: 1,
                  CLOSING: 2,
                  CLOSED: 3,
                  readyState: 1,
                  protocol: 'vite-hmr',
                  url: urlStr,
                  send: function() {},
                  close: function() {
                    fakeWs.readyState = 3;
                    target.dispatchEvent(new Event('close'));
                  },
                  addEventListener: target.addEventListener.bind(target),
                  removeEventListener: target.removeEventListener.bind(target),
                  dispatchEvent: target.dispatchEvent.bind(target)
                };
                setTimeout(function() {
                  target.dispatchEvent(new Event('open'));
                }, 0);
                return fakeWs;
              }
              return new NativeWebSocket(url, protocols);
            };
            window.WebSocket.prototype = NativeWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (e) {}

        // 2. Error and Rejection Filter for benign Vite HMR noise
        const isViteBenign = function(val) {
          if (!val) return false;
          const str = typeof val === 'string' ? val : (val.message || String(val));
          return (
            str.includes("reading 'send'") ||
            str.includes('failed to connect to websocket') ||
            str.includes('WebSocket closed without opened') ||
            str.includes('vite:ws')
          );
        };

        const origError = console.error;
        console.error = function(...args) {
          if (args.some(isViteBenign)) return;
          return origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(isViteBenign)) return;
          return origWarn.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteBenign(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          if (isViteBenign(event.message) || isViteBenign(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
